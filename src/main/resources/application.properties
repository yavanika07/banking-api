spring.application.name=banking-api
server.port=8080

# PostgreSQL (override with environment variables, e.g. in docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankingdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: base64-encoded secret of at least 32 bytes. Set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
app.jwt.expiration-seconds=3600

# Business rules (INR)
app.rules.savings-min-balance=500.00
app.rules.per-transaction-limit=100000.00
