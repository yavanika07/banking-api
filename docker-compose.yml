services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/bankingdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Generate your own: openssl rand -base64 48
      JWT_SECRET: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
    ports:
      - "8080:8080"

volumes:
  pgdata:
